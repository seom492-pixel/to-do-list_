
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="./style.css">

  <title>To-Do List</title>

  <style>
    /* 완료된 할 일 표시 */
    .completed {
      text-decoration: line-through;
      color: gray;
    }
  </style>
</head>
<body>

  <h1 id="title">오늘의 할 일</h1>

  <p id="message">할 일을 관리해 보세요.</p>

  <input id="todoInput"
         type="text"
         placeholder="할 일을 입력하세요">

  <button onclick="addTodo()">추가</button>

  <ul id="todoList">
    <li>JavaScript 공부하기</li>
    <li>과제 제출하기</li>
  </ul>

  <p id="todoCount">
    전체 2개 / 완료 0개
  </p>

  <script src="./script.js"></script>
</body>
</html>
